# Mosquitto configuration for Lab 4 (TLS + password auth)
# Used by docker-compose.yml

# Plain MQTT listener (for quick testing only — disable in production)
listener 1883
allow_anonymous true

# TLS listener
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2

# Password authentication on TLS port
password_file /mosquitto/config/passwd

# Logging
log_dest stdout
log_type all
